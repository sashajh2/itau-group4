# Template for configs/config.yaml -- copy it, then fill in your own values:
#
#     cp configs/config_template.yaml configs/config.yaml
#
# configs/config.yaml is gitignored. This template is NOT, so never put a real
# secret in this file.
#
# The loader (utils/config_loader.py) runs os.path.expandvars over the file
# before parsing, so ${VAR} is substituted from the environment. Prefer that for
# every secret below -- export the variable in your shell instead of pasting the
# value here, and config.yaml stays safe to share.

### Dropbox ###
# Create an app at https://www.dropbox.com/developers/apps to get the key/secret.
dropbox:
  app_key: "${DROPBOX_APP_KEY}"
  app_secret: "${DROPBOX_APP_SECRET}"

  # Long-lived auth used by dropbox_utils/dropbox_utils.py. Generate once with:
  #     python dropbox_utils/one_time_get_refresh_token.py
  refresh_token: "${DROPBOX_REFRESH_TOKEN}"

  # Short-lived token (expires in ~4 hours), used only by
  # data/preprocessing/storage/embedding_retriever.py. Prefer refresh_token.
  access_token: "${DROPBOX_ACCESS_TOKEN}"

  # Read by dropbox_utils/one_time_get_refresh_token.py during the OAuth flow.
  # redirect_uri must end in /callback and its port must match `port` below,
  # and must be registered as a redirect URI on the Dropbox app.
  redirect_uri: "http://localhost:8080/callback"
  port: 8080
  scopes:  # must match the permissions granted to your Dropbox app
    - account_info.read
    - files.metadata.read
    - files.content.read
    - files.content.write

  upload_folder: "itau-group4/"  # optional default base path in Dropbox

### Databases ###
database:
  embedding_db_path: "db/embeddings.sqlite3"
  model_db_path: "db/models.sqlite3"  # if you split model storage

  # Neon Postgres + pgvector, used by retriever/retriever.py and scripts/neon/*.
  # Connection strings embed a password -- keep them in the environment.
  postgres:
    neon_database_url: "${NEON_DATABASE_URL}"  # pooled connection
    neon_direct_url: "${NEON_DIRECT_URL}"      # direct connection, for migrations

faiss:
  local_index_dir: "data/faiss_indexes/"
  index_name_format: "{source}_{embedding_type}_{mode}_{model_name}.index"

data:
  temp_segment_dir: "data/temp_video_extracted/"
  processed_metadata_dir: "data/processed_metadata/"
  dummy_test_embeddings: "data/test/test_embeddings.npy"  # if applicable

### Dataset sources ###
# Token from https://huggingface.co/settings/tokens -- needed to download
# AVDeepfake1M and MovieGen (data/loaders/avdeepfake.py, moviegen.py).
huggingface:
  token: "${HF_TOKEN}"

# From https://www.kaggle.com/settings -> "Create New Token" (kaggle.json).
# Used by data/loaders/dfd.py.
kaggle:
  id: "${KAGGLE_USERNAME}"
  key: "${KAGGLE_KEY}"

defaults:
  segment_duration: 0.25 # seconds
  sample_rate: 44100     # for audio extraction, etc.
